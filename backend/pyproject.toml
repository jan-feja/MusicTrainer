[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-trainer"
version = "0.1.0"
description = "Backend of the music practice app: YouTube search, downloads, the local video library and beat detection."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # [default] brings yt-dlp-ejs, the scripts yt-dlp needs to solve YouTube's JavaScript challenges
    "yt-dlp[default]>=2025.11.12",
    # beat and downbeat detection (brings PyTorch; on Windows and macOS PyPI ships the CPU build)
    "beat-this>=1.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
music-trainer = "music_trainer.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/music_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "network: talks to YouTube or downloads the beat model; run with `pytest -m network`",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
